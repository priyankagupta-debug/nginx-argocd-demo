apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-parent
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_USERNAME/nginx-argocd-demo.git
    targetRevision: refs/heads/main
    path: apps/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true