apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-child-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/priyankagupta-debug/nginx-argocd-demo.git
    targetRevision: main
    path: workloads/nginx2

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      